# Builds an unsigned iOS app (.ipa) for sideloading (Sideloadly, AltStore, etc.,
# which re-sign it with your own Apple ID). No Apple developer account needed here.
#
# Download it from the run's "Artifacts" section, or from the rolling
# "ios-latest" pre-release on the repo's Releases page.
name: iOS app (unsigned IPA)

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write # to update the ios-latest pre-release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57 needs Xcode 26.4 or newer.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: app/ios
        run: pod install

      - name: Build (signing disabled)
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|\*\* BUILD" || true
          test -d "build/Build/Products/Release-iphoneos/$SCHEME.app"

      - name: Package .ipa
        run: |
          rm -rf Payload && mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/$SCHEME.app" Payload/
          zip -qry shopr-unsigned.ipa Payload
          ls -lh shopr-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: shopr-ios-unsigned-ipa
          path: app/shopr-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: app/xcodebuild.log
          if-no-files-found: ignore

      - name: Publish to the ios-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest shopr-unsigned.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "shopr iOS (unsigned, latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Sideload it with Sideloadly/AltStore, which signs it with your Apple ID."
