[project]
name = "shopr"
version = "0.1.0"
description = "Moodboard-driven secondhand clothing search (Phase 0 prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    "anthropic>=0.70",
    "imageio-ffmpeg>=0.5",
    "pillow-heif>=0.18",
]

[project.scripts]
shopr = "shopr.__main__:main"

[project.optional-dependencies]
# The real image model. Kept optional so the test suite runs without torch.
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "open_clip_torch>=2.26",
    "transformers>=4.44",
    "ftfy",
]
dev = ["pytest>=8", "respx>=0.21"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shopr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
